[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernetic-gym-assistant"
version = "0.1.0"
description = "Personal AI fitness coach built on the Menno Henselmans methodology"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
# Runtime code lives in app/; evaluation, scripts, tests and notebooks stay out of the package.
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
