[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernetic-gym-assistant"
version = "0.1.0"
description = "Personal AI fitness coach built on the Menno Henselmans methodology"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
# Runtime code lives in app/; evaluation, scripts, tests and notebooks stay out of the package.
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The integration tests are async from top to bottom (async engine, async client), so
# every coroutine test runs on the loop without a marker on each one.
asyncio_mode = "auto"
# One event loop for the whole run: the engine and its connection pool are built once
# per session, and a per-test loop would leave them attached to a loop that is already
# closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
